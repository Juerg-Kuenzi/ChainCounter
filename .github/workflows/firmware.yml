name: Firmware

# Baut die Firmware bei jedem Push und Pull Request. Bei einem veröffentlichten
# Release werden die fertigen Dateien zusätzlich an das Release angehängt.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kernlogik auf dem PC testen
        run: make -C tests/host

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # nur für das Anhängen an ein Release nötig
    env:
      FQBN: esp32:esp32:XIAO_ESP32C3
      ESP32_CORE: "3.0.7"   # wie im README angegeben getestet
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Boardpaket installieren
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}
          arduino-cli core list

      # Ohne secrets.h werden Platzhalter einkompiliert. Das ist gewollt:
      # SSID und Passwort stehen im EEPROM und werden über die Konsole gesetzt.
      - name: Kompilieren
        run: >
          arduino-cli compile --fqbn ${FQBN} --warnings default
          --output-dir build firmware/ChainCounter

      - name: Dateien zum Aufspielen zusammenstellen
        run: |
          ls -l build
          VERSION=$(sed -n 's/^#define FW_VERSION *"\(.*\)".*/\1/p' firmware/ChainCounter/config.h)
          echo "FW_VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist
          # Gesamtabbild (Bootloader, Partitionen, Programm) für Adresse 0x0
          if [ ! -f build/ChainCounter.ino.merged.bin ]; then
            pip install --quiet esptool
            python3 -m esptool --chip esp32c3 merge_bin -o build/ChainCounter.ino.merged.bin \
              --flash_mode keep --flash_freq keep --flash_size keep \
              0x0 build/ChainCounter.ino.bootloader.bin \
              0x8000 build/ChainCounter.ino.partitions.bin \
              0x10000 build/ChainCounter.ino.bin
          fi
          cp build/ChainCounter.ino.merged.bin "dist/ChainCounter-${VERSION}-komplett-0x0.bin"
          cp build/ChainCounter.ino.bin "dist/ChainCounter-${VERSION}-programm-0x10000.bin"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ChainCounter-firmware
          path: dist/*.bin
          if-no-files-found: error

      - name: An das Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.bin --clobber
